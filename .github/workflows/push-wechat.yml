name: 收盘选股推送微信

# 每个交易日 15:10（北京时间）自动跑全市场选股 + 生成策略成绩单，推送到微信。
# 前置 1：仓库根目录要有 strategy_scorecard.py（成绩单模块）
# 前置 2：Settings → Secrets → Actions 里有 SERVERCHAN_KEY
# 手动测试：Actions 页面点 Run workflow（手动触发会自动忽略交易日）
#
# ⚠️ TZ: Asia/Shanghai 是必须的！GitHub 服务器时钟是 UTC，不设时区的话：
#   ① 推送里的时间戳全比北京慢 8 小时（显示成"早上 10:54"）；
#   ② main.py 的「15 点前不更新数据」判断会永远成立 → 每天用旧数据选股（已实测踩坑）。

on:
  schedule:
    - cron: '10 7 * * 1-5'   # UTC 时间，等于北京时间 15:10，周一到周五
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data
          key: db-${{ github.run_id }}
          restore-keys: db-
      - name: 初始化数据（只在第一次跑）
        timeout-minutes: 80
        run: |
          [ -f data/stock_selection.db ] || python main.py init
      - name: 选股 + 成绩单 + 推送
        timeout-minutes: 50
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          cat > /tmp/go.py <<'EOF'
          import os, re, sqlite3, sys, time, requests
          from datetime import datetime

          # GitHub 服务器是 UTC。这里再兜一层时区，确保 main.py 里的
          # 「15 点前不更新数据」判断按北京时间走（不设的话云端永远认为没收盘）。
          os.environ.setdefault("TZ", "Asia/Shanghai")
          try:
              time.tzset()
          except Exception:
              pass

          os.chdir(os.environ.get("GITHUB_WORKSPACE", "."))
          sys.path.insert(0, os.getcwd())
          got, box = {}, {}
          scores = {}

          class Notifier:
              def __init__(self, url=""): pass
              def send_text(self, text):
                  got["t"] = text
                  return True
              def send_post(self, title, lines):
                  got["t"] = title + "\n" + "\n".join(lines)
                  return True

          import utils.feishu_notifier as fm
          fm.FeishuNotifier = Notifier       # 把发飞书的出口换成"拦下来"

          # 买入建议分析原本每只股票都发一次实时请求给腾讯的 K 线接口，
          # 那个接口会被腾讯 WAF 拦（501），一失败整段就静默消失。
          # 改成从本地数据库读——数据库里本来就有 250+ 天的日线，够算均线/RSI/MACD。
          try:
              import sqlite3
              import simple_analyzer as sa
              _kl = sqlite3.connect("data/stock_selection.db")

              def _kline_from_db(code, _c=_kl):
                  rows = _c.execute(
                      "SELECT date, open, high, low, close, volume FROM stock_kline"
                      " WHERE code=? ORDER BY date DESC LIMIT 60", (str(code),)).fetchall()
                  return [{"date": r[0], "open": r[1], "high": r[2],
                           "low": r[3], "close": r[4], "volume": r[5] or 0}
                          for r in reversed(rows)]

              sa.get_stock_kline = _kline_from_db
              print("[patch] 买入建议分析改为读本地数据库（不再依赖腾讯接口）")
          except Exception as exc:
              print("!! 本地K线补丁失败（买入建议分析可能缺失）:", exc)

          # 把「买入建议分析」每天给出的评分记下来，之后才能统计每个分数段的真实胜率
          # （现在只记录，不影响推送；统计留到数据攒够以后）。
          try:
              import simple_analyzer as _sa
              _orig_analyze = _sa.analyze_stock

              def _analyze_recording(code, name, _f=_orig_analyze):
                  r = _f(code, name)
                  try:
                      scores[str(code)] = r
                  except Exception:
                      pass
                  return r

              _sa.analyze_stock = _analyze_recording
              print("[patch] 买入建议评分开始记录")
          except Exception as exc:
              print("!! 评分记录补丁失败（不影响推送）:", exc)

          # ---------- 今日榜单：完全照「高胜率策略选股」HTML 的六段式结构 ----------
          # ① 策略梯队（胜率+均值，分一/二梯队/避开）
          # ② 今日优先关注（好策略 + 评分≥75）
          # ③ 可以看但别追（好策略但评分中等 / RSI 超买）
          # ④ 高分但策略没战绩（分数仅供参考）
          # ⑤ 避开名单（差策略选出的票 / 好策略但超买严重）
          # ⑥ 一句话总结
          #
          # ⚠️ 样本门槛取「n≥5 用 T+1，否则退回 T+5」，不要卡到 8：
          #    云端数据库才刚开始积累（每个策略十几个样本），门槛太严会导致
          #    全部策略都变"无战绩"，整张榜单一梯队全空 —— 已实测踩过。
          try:
              def _build_curated(results, scores, card_data, names):
                  if not card_data or card_data.get("empty") or not results:
                      return ""
                  def cn(s):
                      return (names or {}).get(s, s)
                  bench = ((card_data.get("bench") or {}).get(1) or {}).get("avg")

                  # --- 每个策略取一个"可参照"的持有期：优先 T+1(n≥5)，退回 T+5(n≥5) ---
                  tiers = {}
                  for strat, st in card_data.get("strategies", []):
                      ref, refh = None, None
                      for h in (1, 5):
                          s = st.get(h)
                          if s and s.get("n", 0) >= 5:
                              ref, refh = s, h
                              break
                      if ref:
                          tiers[strat] = dict(ref, h=refh)

                  good = {s for s, r in tiers.items()
                          if r["win"] >= 0.55 and (bench is None or r["avg"] > bench)}
                  # 避开：只有"胜率差"才算差策略。跑不过大盘但胜率尚可的（如 75% 胜率
                  # 撞上普涨日的高基准）不算差，只是"当日不占优"，不能拉黑 —— 实测踩过。
                  bad = {s for s, r in tiers.items() if r["win"] < 0.40}
                  # 一梯队：胜率≥75% 且跑赢大盘；二梯队：胜率≥55% 且跑赢大盘
                  tier1 = {s for s, r in tiers.items()
                           if r["win"] >= 0.75 and (bench is None or r["avg"] > bench)}
                  tier2 = {s for s, r in tiers.items()
                           if s not in tier1 and r["win"] >= 0.55
                           and (bench is None or r["avg"] > bench)}
                  # 胜率高但当日没跑赢大盘 → 中性（既不推荐也不拉黑）
                  neutral = {s for s, r in tiers.items()
                             if s not in tier1 and s not in tier2 and s not in bad}
                  nobattle = {s for s in results if s not in tiers}

                  # --- 个股 × 策略 交叉 ---
                  stock_strats, count = {}, {}
                  for strat, signals in (results or {}).items():
                      for sig in signals or []:
                          code = str(sig.get("code", ""))
                          if not code:
                              continue
                          stock_strats.setdefault(code, set()).add(strat)
                          count[strat] = count.get(strat, 0) + 1
                  if not stock_strats:
                      return ""

                  def _clean_reason(txt):
                      """形态理由只留核心几项，去掉冗长的重复修饰。"""
                      parts = [x.strip() for x in (txt or "").replace("、", ",").split(",") if x.strip()]
                      keep, seen = [], set()
                      for p in parts:
                          # "均线多头排列" 归一到 "均线多头"
                          p = p.replace("均线多头排列", "均线多头")
                          if p not in seen:
                              seen.add(p)
                              keep.append(p)
                      return "，".join(keep[:3])

                  rows = []
                  for code, strats in stock_strats.items():
                      info = scores.get(code) or {}
                      # 名称去掉中间多余空格（"万  科Ａ" → "万科Ａ"）
                      nm_ = re.sub(r"\s+", "", str(info.get("name") or code)) or code
                      rows.append({
                          "code": code, "name": nm_,
                          "score": info.get("score") or 0,
                          "reason": _clean_reason("、".join(info.get("reasons") or [])),
                          "good": sorted(strats & good), "all": sorted(strats),
                          "bad": sorted(strats & bad),
                          "nobattle": sorted(strats & nobattle),
                      })

                  def _tier_of(strats):
                      """取该票所属策略里的最高梯队（1 最好）。"""
                      ss = set(strats or [])
                      if ss & tier1:
                          return 1
                      if ss & tier2:
                          return 2
                      return 3

                  def _hot(r):
                      return "超买" in r["reason"]

                  grp_b = sorted([r for r in rows if r["good"] and r["score"] >= 75],
                                 key=lambda r: (-r["score"], _tier_of(r["good"])))[:8]
                  picked = {r["code"] for r in grp_b}
                  # ③ 可看别追：好策略但评分中等（含超买）；先算出来，⑤ 避开要排除它们
                  grp_c = sorted([r for r in rows if r["code"] not in picked and r["good"]
                                  and 60 <= r["score"] < 75],
                                 key=lambda r: -r["score"])[:5]
                  # ④ 只有"完全不属于好策略、且所属策略无战绩"的高分股才进这组
                  grp_d = sorted([r for r in rows if r["code"] not in picked
                                  and not r["good"] and r["nobattle"] and r["score"] >= 80],
                                 key=lambda r: -r["score"])[:5]
                  # ⑤ 避开：差策略选出的票（最严重）。已在③列过的不再重复列。
                  _seen = {r["code"] for r in grp_c}
                  avoid1 = [r for r in rows if r["bad"] and not r["good"]
                            and r["code"] not in _seen][:4]
                  avoid2 = sorted([r for r in rows
                                   if r["code"] not in _seen and r["code"] not in {x["code"] for x in avoid1}
                                   and r["good"] and _hot(r) and r["score"] < 60],
                                  key=lambda r: -r["score"])[:7]
                  if not grp_b and not grp_c:
                      return ""

                  def nm(r):
                      return f"{r['code']} {r['name']}"

                  L = ["## 🎯 高胜率策略 · 今日选股榜单", ""]

                  # ① 策略梯队：一梯队 → 二梯队 → 无战绩 → 避开
                  L += ["### ① 策略梯队（先选策略，再选票）", "",
                        "| 策略 | 梯队 | 胜率/均值 | 今日入选 |", "|---|---|---|---|"]

                  def _rank(kv):
                      strat, r = kv
                      if strat in tier1:
                          g = 0
                      elif strat in tier2:
                          g = 1
                      elif strat in neutral:
                          g = 2
                      elif strat in bad:
                          g = 3
                      else:
                          g = 4
                      return (g, -r["win"], -r["avg"])

                  for strat, r in sorted(tiers.items(), key=_rank):
                      if strat in tier1:
                          tg = "一梯队"
                      elif strat in tier2:
                          tg = "二梯队"
                      elif strat in bad:
                          tg = "避开"
                      else:
                          tg = "中性"
                      L.append("| %s | %s | T+%d %.0f%% / %+.2f%% | %d 只 |"
                               % (cn(strat), tg, r["h"], r["win"] * 100, r["avg"] * 100,
                                  count.get(strat, 0)))
                  for strat in sorted(nobattle):
                      _st = dict(card_data["strategies"]).get(strat) or {}
                      _mx = max((s.get("n", 0) for s in _st.values() if s), default=0)
                      L.append("| %s | 无战绩 | 样本不足（%d 个） | %d 只 |"
                               % (cn(strat), _mx, count.get(strat, 0)))

                  # ② 今日优先关注
                  if grp_b:
                      L += ["", "### ② 今日优先关注（好策略 + 评分≥75）", "",
                            "| 股票 | 评分 | 入选策略 | 形态理由 |", "|---|---|---|---|"]
                      for a, r in enumerate(grp_b, 1):
                          st = "·".join(cn(s) for s in r["good"])
                          marks = []
                          if len(r["all"]) > 1:
                              marks.append("双策略共振")
                          if r["good"] and _tier_of(r["good"]) == 1:
                              marks.append("⭐最高梯队")
                          if marks:
                              st += "（" + "·".join(marks) + "）"
                          L.append("| %d. %s | **%d** | %s | %s |"
                                   % (a, nm(r), r["score"], st, r["reason"] or "—"))

                  # ③ 可以看但别追
                  if grp_c:
                      L += ["", "### ③ 可以看但别追（好策略，评分中等或超买）",
                            "", "| 股票 | 评分 | 入选策略 | 注意点 |", "|---|---|---|---|"]
                      for r in grp_c:
                          st = "·".join(cn(s) for s in r["good"])
                          note = ("⚠️ " + r["reason"]) if _hot(r) else (r["reason"] or "形态尚可")
                          L.append("| %s | %d | %s | %s |"
                                   % (nm(r), r["score"], st, note))

                  # ④ 高分但策略没战绩
                  if grp_d:
                      L += ["", "### ④ 高分但策略没战绩（分数仅供参考，谨慎）", "",
                            "| 股票 | 评分 | 所属策略 | 说明 |", "|---|---|---|---|"]
                      for r in grp_d:
                          st = "·".join(cn(s) for s in r["nobattle"])
                          L.append("| %s | %d | %s | 该策略历史样本不足，无胜率可依 |"
                                   % (nm(r), r["score"], st))

                  # ⑤ 避开名单
                  if avoid1 or avoid2:
                      L += ["", "### ⑤ 避开名单", "",
                            "| 股票 | 评分 | 策略 | 原因 |", "|---|---|---|---|"]
                      for r in avoid1:
                          badn = "、".join(cn(s) for s in r["bad"])
                          wr = ["%s %.0f%%/%.2f%%"
                                % (cn(s), tiers[s]["win"] * 100, tiers[s]["avg"] * 100)
                                for s in r["bad"] if s in tiers]
                          L.append("| %s | %d | 🚫%s | 该策略历史 %s，评分再高也不碰 |"
                                   % (nm(r), r["score"], badn, "、".join(wr)))
                      if avoid2:
                          L.append("| %s | %s | 好策略但 RSI 超买 | 等回踩再看，不追高 |"
                                   % ("、".join(nm(r) for r in avoid2),
                                      "/".join(str(r["score"]) for r in avoid2)))

                  # ⑥ 一句话总结
                  top = grp_b[:2]
                  hoth = [r["name"] for r in grp_c if _hot(r)][:3]
                  summ = []
                  if top:
                      summ.append("最值得看：**%s**（%s，%d 分）。"
                                  % ("、".join(r["name"] for r in top),
                                     "、".join(cn(s) for r in top for s in r["good"][:1]),
                                     top[0]["score"]))
                  if grp_b:
                      _best = None
                      for _r in grp_b:
                          if len(_r["all"]) > 1:
                              _best = _r
                              break
                      if _best:
                          summ.append("双策略共振加分：**%s**（%s）。"
                                      % (_best["name"],
                                         "、".join(cn(s) for s in _best["all"])))
                  if grp_d:
                      summ.append("高分但策略无战绩的 %s（%d 分）只作参考，别单凭分数追。"
                                  % ("、".join(r["name"] for r in grp_d[:2]), grp_d[0]["score"]))
                  if avoid1:
                      summ.append("**%s 一律避开**——所属策略历史胜率差。"
                                  % "、".join(r["name"] for r in avoid1))
                  if hoth:
                      summ.append("RSI 超买的 %s 等回踩，不追高。" % "、".join(hoth))
                  if summ:
                      L += ["", "### ⑥ 一句话总结", ""]
                      for i, s in enumerate(summ[:4]):
                          L.append("%s %s" % ("①②③④"[i], s))

                  L.append("")
                  L.append("⚠️ 样本少时胜率波动极大；本榜为历史统计，不构成投资建议。")
                  L.append("")
                  return "\n".join(L)
          except Exception as exc:
              print("!! 榜单函数定义失败:", exc)

          if os.environ.get("FORCE") == "1":
              import utils.trade_date_utils as td
              td.is_trading_day = lambda *a, **k: True

          import main as app
          _orig_run_full = app.QuantSystem.run_full       # 顺手截获选股结果
          def _patched(self, *a, **k):
              r = _orig_run_full(self, *a, **k)
              box["results"] = r
              return r
          app.QuantSystem.run_full = _patched

          # ---------- 快车道：腾讯批量行情补当日收盘 ----------
          # 旧通道逐批拉K线要 20-30 分钟；qt.gtimg.cn 一次查 60 只，
          # 全市场约 88 次请求、1 分钟内写完全部当日收盘。
          # 覆盖率 ≥90% 才接管 _smart_update，否则照旧走旧通道兜底。
          try:
              if datetime.now().weekday() < 5:   # 周末直接跳过
                  import urllib.request as _ur

                  def _fast_update_today(db_path="data/stock_selection.db"):
                      today = datetime.now().strftime("%Y-%m-%d")
                      ymd = today.replace("-", "")
                      conn = sqlite3.connect(db_path)
                      codes = [r[0] for r in conn.execute(
                          "SELECT DISTINCT code FROM stock_kline ORDER BY code")]
                      conn.close()
                      total = len(codes)
                      updated, rows = 0, []
                      for i in range(0, total, 60):
                          batch = codes[i:i + 60]
                          syms = ",".join(("sh" if c.startswith(("6", "9")) else "sz") + c
                                          for c in batch)
                          try:
                              _req = _ur.Request("https://qt.gtimg.cn/q=" + syms,
                                                 headers={"User-Agent": "Mozilla/5.0"})
                              raw = _ur.urlopen(_req, timeout=10).read().decode("gbk", "replace")
                          except Exception:
                              continue
                          q = {}
                          for line in raw.strip().split(";"):
                              line = line.strip()
                              if "=" not in line:
                                  continue
                              f = line.split("=", 1)[1].strip().strip('"').split("~")
                              if len(f) >= 46 and f[2]:
                                  q[f[2]] = f
                          for code in batch:
                              f = q.get(code)
                              if not f or not str(f[30]).startswith(ymd):
                                  continue      # 非今日快照（节假日/停牌），不写
                              try:
                                  close = float(f[3])
                                  if close <= 0:
                                      continue
                                  o = float(f[5]) or close
                                  h = float(f[33]) or close
                                  lo = float(f[34]) or close
                                  v = int(float(f[6] or 0))
                              except Exception:
                                  continue
                              rows.append((code, today, o, h, lo, close, v))
                              updated += 1
                          time.sleep(0.25)
                      if rows:
                          conn = sqlite3.connect(db_path)
                          with conn:
                              conn.executemany(
                                  "DELETE FROM stock_kline WHERE code=? AND date=?",
                                  [(r[0], r[1]) for r in rows])
                              conn.executemany(
                                  "INSERT INTO stock_kline"
                                  " (code,date,open,high,low,close,volume,market_cap,K,D,J)"
                                  " VALUES (?,?,?,?,?,?,?,NULL,NULL,NULL,NULL)", rows)
                          conn.close()
                      return {"total": total, "updated": updated,
                              "ok": total > 0 and updated >= total * 0.9}

                  _stats = _fast_update_today()
                  print("[fastlane]", _stats)
                  if _stats["ok"]:
                      def _skip_update(self, max_stocks=None, check_latest=True):
                          print("[fastlane] 当日数据已由腾讯批量行情写好，跳过旧通道")
                      app.QuantSystem._smart_update = _skip_update
          except Exception as exc:
              print("!! 快车道失败（不影响，走旧通道）:", exc)

          sys.argv = ["main.py", "run"]
          try:
              app.main()
          except SystemExit:
              pass

          text = got.get("t") or ""
          if not text:
              print("非交易日或未选出股票，本次不推送。")
              sys.exit(0)

          # ---------- 买入建议评分入库：为将来的「评分段胜率」攒数据 ----------
          if scores:
              try:
                  _c = sqlite3.connect("data/stock_selection.db")
                  _c.execute(
                      "CREATE TABLE IF NOT EXISTS advice_log ("
                      " trade_date TEXT, code TEXT, name TEXT, score INTEGER,"
                      " advice TEXT, reasons TEXT, recorded_at TEXT,"
                      " PRIMARY KEY (trade_date, code))")
                  _day = _c.execute("SELECT MAX(date) FROM stock_kline").fetchone()[0]
                  for _code, _r in scores.items():
                      _c.execute(
                          "INSERT OR REPLACE INTO advice_log VALUES (?,?,?,?,?,?,?)",
                          (_day, _code, _r.get("name"), _r.get("score"),
                           _r.get("advice"), ", ".join(_r.get("reasons") or []),
                           datetime.now().strftime("%Y-%m-%d %H:%M:%S")))
                  _c.commit()
                  _c.close()
                  print("[评分记录] 已入库 %d 条（%s）" % (len(scores), _day))
              except Exception as exc:
                  print("!! 评分入库失败（不影响推送）:", type(exc).__name__, exc)

          # ---------- 策略成绩单：记录今天的选股，回看历史选股的真实涨跌 ----------
          try:
              import strategy_scorecard as sc
              conn = sqlite3.connect("data/stock_selection.db")
              sel_date = conn.execute("SELECT MAX(date) FROM stock_kline").fetchone()[0]

              if box.get("results"):
                  sc.record_picks(conn, box["results"], sel_date)

              names = {}
              try:
                  import yaml
                  with open("config/strategy_params.yaml", encoding="utf-8") as f:
                      cfg = yaml.safe_load(f) or {}
                  for k, v in (cfg.get("strategies") or {}).items():
                      names[k] = (v or {}).get("display_name", k)
              except Exception as exc:
                  print("策略中文名映射读取失败(忽略):", exc)

              card, card_data = sc.build(conn, lookback_days=60, display_names=names, horizons=(1, 5))
              text = text + "\n" + card
              conn.close()
              print("[成绩单] 已并入推送正文")

              # 把精选板块插到"共 X 只股票入选"之后（推送顶部）
              try:
                  cur = _build_curated(box.get("results") or {}, scores, card_data, names)
                  if cur:
                      _ls = text.split("\n")
                      _idx = 0
                      for _i, _l in enumerate(_ls[:6]):
                          if "只股票入选" in _l:
                              _idx = _i
                              break
                      text = "\n".join(_ls[:_idx + 1]) + "\n" + cur + "\n" + "\n".join(_ls[_idx + 1:])
                      print("[精选] 已插入推送顶部")
                      # 精选已覆盖逐票评分，原始"买入建议分析"长清单不再推送
                      _i1 = text.find("🎯 买入建议分析")
                      if _i1 >= 0:
                          _i0 = text.rfind("━━━", 0, _i1)
                          _i3 = text.find("📈 今日大盘复盘", _i1)
                          if _i0 >= 0 and _i3 > _i1:
                              text = (text[:_i0] + "━━━━━━━━━━━━━━━━━━━━\n"
                                      + text[_i3:])
                              print("[精简] 买入建议长清单已由精选替代，不再推送")
                      # ---------- 推送前自检：格式跑偏就报警，不悄悄发出去 ----------
                      try:
                          _chk = []
                          if "🎯 高胜率策略 · 今日选股榜单" not in text:
                              _chk.append("榜单标题缺失")
                          if "### ① 策略梯队" not in text:
                              _chk.append("① 策略梯队缺失")
                          if "### ② 今日优先关注" not in text:
                              _chk.append("② 今日优先关注缺失（可能今天没有 ≥75 分的好票）")
                          if "### ⑥ 一句话总结" not in text:
                              _chk.append("⑥ 一句话总结缺失")
                          if "🎯 买入建议分析" in text:
                              _chk.append("买入建议长清单未删除")
                          if len(text) > 26000:
                              _chk.append("正文过长(%d 字符)，可能被截断" % len(text))
                          if _chk:
                              print("!! [自检不通过] " + "；".join(_chk))
                              text = ("⚠️ **本次推送格式自检未通过**："
                                      + "；".join(_chk) + "\n\n") + text
                          else:
                              print("[自检] 格式检查全部通过 ✓")
                      except Exception as exc:
                          print("!! 自检异常(不影响推送):", exc)
              except Exception as exc:
                  print("!! 精选插入失败（不影响推送）:", exc)
          except Exception as exc:
              print("!! 成绩单生成失败（不影响推送）:", type(exc).__name__, exc)

          with open("/tmp/report.txt", "w", encoding="utf-8") as f:
              f.write(text)
          print(text[:1500])
          print("=== 正文共", len(text), "字符 ===")

          key = (os.environ.get("SERVERCHAN_KEY") or "").strip()
          if not key:
              print("!! 没有配置 SERVERCHAN_KEY（去 Settings → Secrets → Actions 添加）")
              sys.exit(1)
          if len(text) > 28000:
              text = text[:27800] + "\n\n……内容过长已截断"

          r = requests.post(
              "https://sctapi.ftqq.com/%s.send" % key,
              data={"title": "缅A每日推送 " + datetime.now().strftime("%Y-%m-%d"), "desp": text},
              timeout=30,
          )
          print("Server酱 返回:", r.status_code, r.text[:200])
          try:
              ok = r.json().get("code") == 0
          except Exception:
              ok = False
          if not ok:
              print("!! 推送失败：SendKey 错 / 或当天 5 条免费用完了")
              sys.exit(1)
          print("推送成功")
          EOF
          python /tmp/go.py

      - name: 保存报告（保留 30 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 选股报告-${{ github.run_number }}
          path: /tmp/report.txt
          if-no-files-found: ignore
          retention-days: 30
